# ==============================================================================
# BFD GitHub Actions CI Gate (.github/workflows/ci.yml)
#
# Cost & Quota Optimized:
#   - 100% Free & Unlimited on Public GitHub repositories.
#   - Private Repo Quota Friendly: Triggers ONLY on Pull Requests to `main`/`master`,
#     direct pushes to `main`/`master`, or manual `workflow_dispatch` (uses 0 minutes
#     during feature branch WIP commits).
#   - Concurrency Guard: Automatically cancels outdated runs on the same PR branch.
# ==============================================================================

name: CI

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Android Build, Unit Tests & Manifest Permissions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Compile Debug Kotlin & Check Merged Manifest Permissions
        run: ./gradlew compileDebugKotlin testDebugUnitTest checkMergedManifestPermissions
